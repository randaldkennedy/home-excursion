name: Deploy Home Excursion to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'HomeExcursion.Api/**'
      - '.github/workflows/azure-deploy.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: home-excursio
  PROJECT_PATH: HomeExcursion.Api/HomeExcursion.Api.csproj
  PUBLISH_PATH: ${{ github.workspace }}/publish

jobs:
  build-and-deploy:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.*

      - name: Apply Home database migrations
        env:
          HOME_CONNECTION_STRING: ${{ secrets.HOME_EXCURSION_CONNECTION_STRING }}
          ConnectionStrings__HomeExcursion: ${{ secrets.HOME_EXCURSION_CONNECTION_STRING }}
        run: |
          dotnet ef database update `
            --project "${{ env.PROJECT_PATH }}" `
            --startup-project "${{ env.PROJECT_PATH }}" `
            --context HomeExcursionDbContext `
            --connection "$env:HOME_CONNECTION_STRING"

      - name: Apply Platform database migrations
        env:
          HOME_CONNECTION_STRING: ${{ secrets.HOME_EXCURSION_CONNECTION_STRING }}
          ConnectionStrings__HomeExcursion: ${{ secrets.HOME_EXCURSION_CONNECTION_STRING }}
        run: |
          dotnet ef database update `
            --project "${{ env.PROJECT_PATH }}" `
            --startup-project "${{ env.PROJECT_PATH }}" `
            --context LaUltimaExcursionDbContext `
            --connection "$env:HOME_CONNECTION_STRING"

      - name: Publish
        run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration Release --no-build --output "${{ env.PUBLISH_PATH }}"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_PATH }}
